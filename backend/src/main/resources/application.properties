# Database Connection (use these exact values)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Optional: Make SQL output readable
spring.jpa.properties.hibernate.format_sql=true

# Server port
server.port=${PORT:${SERVER_PORT:8080}}

# JWT Configuration
jwt.secret=${JWT_SECRET}
# 24 hours in milliseconds
jwt.expiration=${JWT_EXPIRATION:86400000}

# Mail (optional - emails log to console when SMTP is not configured)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.reports.base-url=${APP_REPORTS_BASE_URL:http://localhost:5217}
app.reports.email.enabled=false

# Set to true for the one-time Project Tracker replacement import.
app.seed.replace-existing=${APP_SEED_REPLACE_EXISTING:false}

# AI Sidecar Service
app.ai.base-url=${APP_AI_BASE_URL:http://localhost:8090}
app.ai.timeout-ms=30000


