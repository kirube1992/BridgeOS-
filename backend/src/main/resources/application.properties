# Database Connection (use these exact values)
spring.datasource.url=jdbc:postgresql://localhost:5432/bridgeos
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Optional: Make SQL output readable
spring.jpa.properties.hibernate.format_sql=true

# Server port
server.port=8080

# JWT Configuration
jwt.secret=8887a158fa5599bfc2897e09febf910f6581f13a4777e307e5bc3000281a6750
# 24 hours in milliseconds
jwt.expiration=86400000



